[package]
name = "haarniska"
version = "0.0.0"
edition = "2024"
description = "Library-first, extensible coding agent harness."
license = "MIT"
repository = "https://github.com/ollivarila/haarniska"
exclude = ["docs/", ".github/", ".claude/"]
keywords = ["agent", "llm", "harness", "ai"]
categories = ["development-tools"]

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
futures-util = "0.3.34"
genai = "=0.7.0-rc.1"
gray_matter = "0.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "process", "sync"] }
tui-markdown = { version = "0.3.10", default-features = false }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
dotenvy = "0.15.7"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
