[package]
name = "haarniska"
version = "0.0.0"
edition = "2024"
description = "Library-first, extensible coding agent harness. Placeholder; under development."
license = "MIT OR Apache-2.0"
keywords = ["agent", "llm", "harness", "ai"]
categories = ["development-tools"]

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
futures-util = "0.3.34"
genai = "0.6.5"
ratatui = "0.30.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "process", "sync"] }

[dev-dependencies]
dotenvy = "0.15.7"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
